name: markdownlint

run-name: markdownlint ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.jsonc"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.jsonc"
  workflow_dispatch:

jobs:
  markdownlint:
    name: Lint Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
